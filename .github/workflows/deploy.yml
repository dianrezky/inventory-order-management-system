name: Deploy to VM

# Runs the same command as the manual deploy (see scripts/deploy-vps.sh) on the
# VM after every push to main. Needs these repository secrets:
#   VM_HOST     VM address (IP or hostname)
#   VM_USER     SSH user (must be root or able to run sudo without a password)
#   VM_SSH_KEY  private key of a deploy-only key pair
#   VM_PORT     optional, defaults to 22
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          for name in VM_HOST VM_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is empty or missing (Settings > Secrets and variables > Actions > Repository secrets)."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -T 10 -p "${VM_PORT:-22}" -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Cannot reach $VM_HOST on SSH port ${VM_PORT:-22} from GitHub (wrong VM_HOST, wrong VM_PORT, or the VM firewall blocks it)."
            exit 1
          fi

      - name: Pull and deploy on the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          if [ -z "$VM_USER" ]; then echo "::error::Repository secret VM_USER is empty or missing."; exit 1; fi
          ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" -o BatchMode=yes "$VM_USER@$VM_HOST" \
            'git -C /opt/ioms pull --ff-only && sudo bash /opt/ioms/scripts/deploy-vps.sh'
