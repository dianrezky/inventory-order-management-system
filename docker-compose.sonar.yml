# SonarQube 26.9 (Community) backed by PostgreSQL — dev code-quality tooling.
# Separate from the app stack (docker-compose.yaml) on purpose.
#
# Usage:
#   docker compose -f docker-compose.sonar.yml up -d
#   # wait until http://localhost:7000/api/system/status returns {"status":"UP"}
#   # scan:  SONAR_TOKEN=<token> sonar-scanner
#
# Unlike the old embedded-H2 setup, this one is upgradeable: to move to a newer
# SonarQube major, bump the image tag, `up -d`, and open /setup to run the DB
# migration — no data loss.

name: ioms-sonar

services:
  sonar_db:
    image: postgres:16
    container_name: ioms_sonar_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: ioms_sonarqube
    depends_on:
      sonar_db:
        condition: service_healthy
    ports:
      - "7000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  sonar_pg_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
